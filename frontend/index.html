<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-mark">AB</div>
      <div class="brand-copy">
        <strong>App Builder</strong>
        <span id="project-name">Untitled project</span>
      </div>
    </div>

    <div class="topbar-actions">
      <button id="save-btn" class="topbar-btn">Save</button>
      <button id="undo-btn" class="topbar-icon-btn" title="Undo">↶</button>
      <button id="redo-btn" class="topbar-icon-btn" title="Redo">↷</button>
      <button id="run-app-btn" class="topbar-btn preview-toggle" type="button">Preview</button>
      <button id="export-btn" class="topbar-btn secondary" type="button">Export</button>
      <button id="theme-toggle-btn" class="topbar-icon-btn" type="button" title="Toggle theme">🌙</button>
    </div>

    <div class="topbar-user">
      <button id="profile-menu-btn" class="profile-btn" title="Profile menu">HZ</button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="left-panel">
      <div class="sidebar-header">
        <div>
          <h2>Component library</h2>
          <p>Drag, drop, and build screen layouts quickly.</p>
        </div>
        <button id="add-template-btn" class="icon-btn" type="button" title="Templates">★</button>
      </div>
      <div class="sidebar-search">
        <input id="component-search" type="search" placeholder="Search components" aria-label="Search components" />
      </div>
      <div id="component-categories" class="component-categories"></div>
      <div class="sidebar-footer">
        <button id="add-page-btn" class="secondary-btn" type="button">+ New screen</button>
      </div>
    </aside>

    <main class="center-panel">
      <div class="center-toolbar">
        <div class="canvas-title">
          <div>
            <h2>Mobile canvas</h2>
            <p id="screen-label" class="screen-label">Preview your app design in real time</p>
          </div>
        </div>
        <div class="canvas-controls">
          <div class="device-switcher">
            <label for="device-select">Device</label>
            <select id="device-select" class="device-select"></select>
          </div>
          <div class="zoom-control">
            <button id="zoom-out-btn" type="button">−</button>
            <span id="zoom-value">100%</span>
            <button id="zoom-in-btn" type="button">+</button>
          </div>
        </div>
      </div>

      <div id="page-tabs" class="page-tabs" role="tablist"></div>

      <div class="preview-viewport">
        <div class="preview-frame-wrap">
          <div id="mobile-preview" class="mobile-preview"></div>
        </div>
      </div>
    </main>

    <aside class="right-panel">
      <div class="panel-header">
        <h2>Inspector</h2>
        <p>Only relevant settings, grouped by purpose.</p>
      </div>
      <div id="properties-panel" class="properties-panel"></div>
    </aside>
  </div>

  <template id="accordion-template">
    <section class="accordion">
      <button class="accordion-trigger" type="button">
        <span class="accordion-title"></span>
        <span class="accordion-icon">+</span>
      </button>
      <div class="accordion-content"></div>
    </section>
  </template>

  <!-- Confirmation modal -->
  <div id="confirm-modal" class="confirm-modal" aria-hidden="true">
    <div class="confirm-backdrop"></div>
    <div class="confirm-card">
      <div id="confirm-message">Are you sure?</div>
      <div class="confirm-actions">
        <button id="confirm-cancel" type="button">Cancel</button>
        <button id="confirm-ok" type="button" class="danger">Yes, delete</button>
      </div>
    </div>
  </div>

  <script src="core/state.js"></script>
  <script src="core/components.js"></script>
  <script src="components/button/defaults.js"></script>
  <script src="components/text/defaults.js"></script>
  <script src="components/image/defaults.js"></script>
  <script src="components/input/defaults.js"></script>
  <script src="components/icon/defaults.js"></script>
  <script src="components/group/defaults.js"></script>
  <script src="components/button/render.js"></script>
  <script src="components/text/render.js"></script>
  <script src="components/image/render.js"></script>
  <script src="components/input/render.js"></script>
  <script src="components/icon/render.js"></script>
  <script src="components/group/children.js"></script>
  <script src="components/group/render.js"></script>
  <script src="core/canvas.js"></script>
  <script src="core/button-styles.js"></script>
  <script src="core/text-styles.js"></script>
  <script src="core/render.js"></script>
  <script src="ui/toast.js"></script>
  <script src="ui/builder.js"></script>
  <script src="components/button/inspector.js"></script>
  <script src="ui/inspector/fields.js"></script>
  <script src="ui/inspector/accordions.js"></script>
  <script src="ui/inspector/actions.js"></script>
  <script src="ui/inspector-presets.js"></script>
  <script src="components/text/inspector.js"></script>
  <script src="components/image/inspector.js"></script>
  <script src="components/input/inspector.js"></script>
  <script src="components/icon/inspector.js"></script>
  <script src="components/group/inspector.js"></script>
  <script src="ui/inspector.js"></script>
  <script src="ui/dragdrop/library.js"></script>
  <script src="ui/dragdrop/ghost.js"></script>
  <script src="ui/dragdrop/canvas-dropzone.js"></script>
  <script src="ui/dragdrop/resize.js"></script>
  <script src="ui/dragdrop.js"></script>
  <script src="ui/keyboard.js"></script>
  <script src="ui/pages.js"></script>
  <script src="script.js"></script>
</body>
</html>
