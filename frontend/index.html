<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-toolbar">
    <div class="toolbar-brand">
      <strong id="app-title-label">App Builder</strong>
    </div>
    <button id="run-app-btn" class="preview-app-btn" type="button">▶ App Preview</button>
  </header>

  <div class="app-shell">
    <aside class="left-panel">
      <div class="panel-header">
        <h2>Components</h2>
        <p>Screen par click karke rakhein, kheench kar move karein</p>
      </div>
      <div id="component-library" class="component-library"></div>
      <div class="left-panel-footer">
        <button id="undo-btn" class="footer-btn" type="button" title="Undo">↶</button>
        <button id="redo-btn" class="footer-btn" type="button" title="Redo">↷</button>
      </div>
    </aside>

    <main class="center-panel">
      <div class="center-toolbar">
        <div class="center-toolbar-title">
          <h2>Mobile Preview</h2>
          <span id="screen-label" class="screen-label">Screen</span>
        </div>
        <div class="center-toolbar-controls">
        <div id="pages-panel-container" class="pages-panel-container">
          <button id="add-page-btn" type="button" class="toolbar-btn">+ Add Page</button>
          <button id="toggle-pages-btn" type="button" class="toolbar-btn">▾</button>
          <button id="create-group-btn" type="button" class="toolbar-btn">+ Group</button>
          <div id="pages-panel" class="pages-list"></div>
        </div>
        <select id="device-select" class="device-select"></select>
      </div>
      </div>
      <div class="preview-viewport">
        <div class="preview-frame-wrap">
          <div id="mobile-preview" class="mobile-preview"></div>
        </div>
      </div>
    </main>

    <aside class="right-panel">
      <div class="panel-header">
        <h2>Settings</h2>
        <p>Jo cheez select ho uski settings</p>
      </div>
      <div id="properties-panel" class="properties-panel"></div>
    </aside>
  </div>

  <template id="accordion-template">
    <section class="accordion">
      <button class="accordion-trigger" type="button">
        <span class="accordion-title"></span>
        <span class="accordion-icon">+</span>
      </button>
      <div class="accordion-content"></div>
    </section>
  </template>

  <!-- Confirmation modal -->
  <div id="confirm-modal" class="confirm-modal" aria-hidden="true">
    <div class="confirm-backdrop"></div>
    <div class="confirm-card">
      <div id="confirm-message">Are you sure?</div>
      <div class="confirm-actions">
        <button id="confirm-cancel" type="button">Cancel</button>
        <button id="confirm-ok" type="button" class="danger">Yes, delete</button>
      </div>
    </div>
  </div>

  <script src="core/state.js"></script>
  <script src="core/components.js"></script>
  <script src="core/canvas.js"></script>
  <script src="core/button-styles.js"></script>
  <script src="core/text-styles.js"></script>
  <script src="core/render.js"></script>
  <script src="ui/toast.js"></script>
  <script src="ui/builder.js"></script>
  <script src="ui/button-inspector.js"></script>
  <script src="ui/inspector.js"></script>
  <script src="ui/dragdrop.js"></script>
  <script src="ui/keyboard.js"></script>
  <script src="script.js"></script>
</body>
</html>
